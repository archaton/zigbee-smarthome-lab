# MQTT -> InfluxDB. Zbiera stany urządzeń z tematów zigbee2mqtt/<nazwa_urządzenia>.
# Jeśli zmienisz SIM_BASE_TOPIC w docker-compose.yml, zmień też temat poniżej.

[agent]
  interval = "10s"
  flush_interval = "10s"
  omit_hostname = true

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["zigbee2mqtt/+"]
  data_format = "json"
  json_string_fields = ["state"]

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "zigbee2mqtt/+"
    measurement = "measurement/_"
    tags = "_/device"

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"
